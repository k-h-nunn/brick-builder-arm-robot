site_name: Brick Builder Arm Robot
site_description: >-
  A simulated SO-101 arm that builds LEGO DUPLO structures in MuJoCo: brick physics, scene
  model, closed-loop placement, and the experiment tooling around them.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - User guide:
      - Install: guide/01-install.md
      - Simulator and bricks: guide/02-simulator-and-bricks.md
      - Rendering and datasets: guide/02b-rendering-and-datasets.md
      - Materials and damage: guide/02c-materials-and-damage.md
      - Damage and breakable bricks: guide/02d-damage-and-breakable-bricks.md
      - Robot and servo model: guide/03-robot-and-servo-model.md
      - Environments: guide/04-environments.md
      - Training and evaluation: guide/05-training-and-evaluation.md
      - Evaluation reports: guide/05b-evaluation-reports.md
      - Perception: guide/06-perception.md
      - Convolutional scene model: guide/06b-conventional-vision-model.md
      - Export and firmware: guide/07-export-and-firmware.md
      - Hardware, wiring, calibration: guide/08-hardware-wiring-calibration.md
      - Running the robot: guide/09-running-the-robot.md
      - Measure and enter parameters: guide/10-measure-and-enter-parameters.md
      - Commands: guide/11-commands.md
      - Closed-loop control: guide/12-closed-loop-control.md
      - Lab notebook template: experiments/TEMPLATE.md
  - Demos:
      - Gallery: demos/README.md
      - Closed-loop placement film: demos/videos.md
  - On-screen wording: terminology.md
  - Glossary: glossary.md
