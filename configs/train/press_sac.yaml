# scripts/train.py --config configs/train/press_sac.yaml
#
# BrickBuilder/PressFromHeld-v0 with the SAC fallback recipe (brick_builder/rl/sac_asym.py)
# instead of PPO. This is a real training budget (hours, same order as configs/train/press.yaml's
# 2,000,000 PPO steps) and has never been run to convergence; only a smoke budget has. What that
# smoke budget measured is in docs/guide/05-training-and-evaluation.md. Choosing between this
# config and press.yaml for a real campaign needs post-optimization throughput numbers this
# project does not have yet.
env: BrickBuilder/PressFromHeld-v0
env_kwargs:
  level: 0
  dr: true
  curriculum: [0.7, 40]
run_name: press_sac
algo: sac

sac:
  n_envs: 4
  n_step: 3
  gamma: 0.99
  tau: 0.005
  lr_actor: 0.0003
  lr_critic: 0.0003
  lr_alpha: 0.0003
  init_alpha: 0.2
  buffer_size: 200000
  batch_size: 256
  warmup_steps: 5000
  utd_ratio: 0.5
  init_log_std: -1.0
  total_steps: 2000000
  seed: 0
  hidden_actor: [64, 64]
  hidden_critic: [256, 256]
  norm_clip: 10.0
  async_envs: true
  vector_context: forkserver
  log_every: 1
