# scripts/train.py --config configs/train/reach.yaml
#
# BrickBuilder/Reach-v0: proves the multi-rate control loop end to end. These exact numbers are the
# ones runs/reach_smoke/ was trained with (docs/guide/05-training-and-evaluation.md): 6 async
# worker processes, ~500 s wall clock on this machine, 200/200 held-out successes.
env: BrickBuilder/Reach-v0
env_kwargs: {}
run_name: reach

ppo:
  n_envs: 6
  n_steps: 256
  epochs: 4
  minibatches: 6
  lr: 0.0003
  gamma: 0.97
  lam: 0.95
  clip: 0.2
  target_kl: 0.02
  ent_coef: 0.002
  vf_coef: 0.5
  max_grad_norm: 0.5
  init_log_std: -1.0
  total_steps: 307200
  seed: 0
  hidden_actor: [64, 64]
  hidden_critic: [128, 128]
  norm_clip: 10.0
  async_envs: true
  vector_context: forkserver
  log_every: 1
