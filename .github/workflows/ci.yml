name: CI

# Runs the fast test suite and a strict docs build on every push and pull request into main.
# NOTE: this workflow has not been exercised on GitHub Actions yet — it was written and its YAML
# syntax validated locally (yaml.safe_load), but the first real run will be on the first push to
# GitHub. Treat the first few runs as shakedown, not as a guarantee everything below is right.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Headless MuJoCo rendering, chosen for a GitHub-hosted CI runner specifically (this is
      # NOT what the team's own dev machines use — see docs/guide/01-install.md, which uses
      # MUJOCO_GL=egl because that machine has a real NVIDIA GPU and libEGL_nvidia).
      #
      # ubuntu-latest runners have no GPU and no /dev/dri device nodes, so MuJoCo's EGL backend
      # has no device to enumerate even with the Mesa EGL packages (libegl1, libgl1, libgles2)
      # installed — EGL device discovery would just come up empty. `osmesa` is a pure
      # CPU/software rasterizer (Off-Screen Mesa) with no GPU or display-server dependency at
      # all, which is the standard, well-documented choice for headless MuJoCo rendering in a
      # plain CI VM (the same choice dm_control and similar projects make for their own CI).
      # Hence: osmesa here, egl on the dev machine and in the docs — both are correct for
      # where they are used.
      #
      # tests/conftest.py only does os.environ.setdefault("MUJOCO_GL", "egl"), which leaves an
      # already-set value alone — so setting MUJOCO_GL here, before pytest starts, wins over
      # that default and every test actually runs under osmesa.
      MUJOCO_GL: osmesa
      CUDA_VISIBLE_DEVICES: ""
      # Four threads beats one-per-core on a two-core runner sharing the box.
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system packages for headless MuJoCo rendering (osmesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install Brick Builder Arm Robot (dev + docs extras)
        run: pip install -e ".[dev,docs]"

      - name: Run fast test suite
        run: python -m pytest -q -m "not slow"

      - name: Build docs (strict)
        run: mkdocs build --strict

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 14
